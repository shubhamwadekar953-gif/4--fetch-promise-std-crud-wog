<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch promise std crud wog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" 
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>

    <h1 class = "text-center p-2">FETCH PROMISE 4TH STD CRUD WOG</h1>
    <div class = "container-fluid">
        <div class = "row">
            <div class = "col-md-4">
                <form id = "stdForm">
                    <div class = "card m-5">
                        <h3 class = "text-center p-2">STUDENT FORM</h3>
                        <div class = "card-body">


                            <div class = "form-group mb-3">
                                <label for = "fName">Full Name :</label>
                                <input type = "text" class = "form-control mb-3" id = "fName">
                            </div>


                            <div class = "form-group">
                                <label for = "regNo">Reg No :</label>
                                <input type = "regNo" class = "form-control mb-3 mb-3" id = "regNo">
                            </div>

                            <div class = "form-group mb-3">
                                <label for = "email">Email :</label>
                                <input type = "email" class = "form-control mb-3" id = "email">
                            </div>
                            
                            <div class = "form-group mb-5">
                                <label for = "contact">Cell No :</label>
                                <input type = "number" class = "form-control" id = "contact">
                            </div>


                            <button type = "submit" class = "btn btn-primary" id = "submitBtn">Submit</button>
                            <button type = "button" class = "btn btn-dark d-none" id = "updateBtn">Update</button>
                        </div>
                    </div>
                </form>
            </div>



            <div class = "col-md-8">
                <div class = "card m-5">
                    <h3 class = " text-center p-2">STUDUNE LIST</h3>
                    <div class = "card-body">
                        <table class = "table table-bordered">
                            <thead>
                                <tr>
                                    <th>FULL NAME</th>
                                    <th>REG NO</th>
                                    <th>EMAIL</th>
                                    <th>CELL NO</th>
                                    <th>EDIT</th>
                                    <th>DELETE</th>
                                </tr>
                            </thead>

                            <tbody id = "stList">
                                <!-- <tr>
                                    <td>shubham Wadekar</td>
                                    <td>U27RX23SOO58</td>
                                    <td>shubh@123</td>
                                    <td>1234567890</td>
                                    <td><i class = "btn btn-outline-success">Edit</i></td>
                                    <td><i class = "btn btn-outline-danger">Remove</i></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>


         <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only"></span>
            </div>
        </div>



        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "app.js"></script>
</body>
</html>
